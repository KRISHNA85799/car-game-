
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Speed Racer - Mobile Racing</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
}

.panel {
    padding: 10px 13px;
    border-radius: 12px;
    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,255,255,.3);
    font-size: 13px;
    line-height: 1.7;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    z-index: 10;
}

.group {
    display: flex;
    gap: 10px;
}

.btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.65);
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 25px;
    font-weight: bold;
    touch-action: none;
    user-select: none;
}

.btn:active {
    background: #008cff;
    transform: scale(.94);
}

#nitro {
    font-size: 13px;
    background: rgba(255,80,0,.75);
}

#overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.76);
    text-align: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 360px;
    padding: 28px 20px;
    border-radius: 20px;
    background: linear-gradient(145deg,#18263d,#080b12);
    border: 1px solid #00c8ff;
    box-shadow: 0 0 30px rgba(0,190,255,.2);
}

.card h1 {
    color: #00c8ff;
    font-size: 30px;
    margin-bottom: 15px;
}

.card p {
    line-height: 1.8;
    margin-bottom: 20px;
    color: #ddd;
}

#start {
    border: 0;
    border-radius: 10px;
    padding: 14px 28px;
    background: #00c8ff;
    color: #00111a;
    font-size: 17px;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

@media (max-width: 360px) {
    .btn {
        width: 53px;
        height: 53px;
    }

    .group {
        gap: 7px;
    }
}
</style>
</head>

<body>

<div id="hud">
    <div class="panel">
        🏁 SCORE: <span id="score">0</span><br>
        📏 DISTANCE: <span id="distance">0</span> m
    </div>

    <div class="panel" style="text-align:right">
        SPEED<br>
        <b><span id="speed">0</span> km/h</b>
    </div>
</div>

<div id="controls">

    <div class="group">
        <button class="btn" id="left">◀</button>
        <button class="btn" id="right">▶</button>
    </div>

    <div class="group">
        <button class="btn" id="brake">▼</button>
        <button class="btn" id="nitro">NITRO ⚡</button>
    </div>

</div>

<div id="overlay">
    <div class="card">
        <h1 id="title">SPEED RACER</h1>

        <p id="message">
            Race through traffic!<br>
            Avoid cars and get the highest score.<br><br>
            Use the touch buttons to steer.
        </p>

        <button id="start">START RACE 🏎️</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {

"use strict";

const $ = id => document.getElementById(id);

let scene, camera, renderer, player;

let traffic = [];
let roadLines = [];
let scenery = [];

let running = false;
let speed = 0;
let distance = 0;
let score = 0;
let spawnTimer = 0;
let lastTime = 0;

let highScore = 0;

try {
    highScore = Number(localStorage.getItem("racerHighScore") || 0);
} catch(e) {}

const lanes = [-2.7, 0, 2.7];

const carColors = [
    0xff2020,
    0xffd32a,
    0xffffff,
    0x9b59ff,
    0x16d9a0,
    0xff7700
];

const keys = {
    left: false,
    right: false,
    brake: false,
    nitro: false
};

function addBox(parent, w, h, d, color, x, y, z) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.7,
            metalness: 0.12
        })
    );

    mesh.position.set(x, y, z);
    parent.add(mesh);

    return mesh;
}

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x8bd4ff);
    scene.fog = new THREE.Fog(0x8bd4ff, 55, 190);

    camera = new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        300
    );

    camera.position.set(0, 7, 12);
    camera.lookAt(0, 0, -12);

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);

    document.body.insertBefore(
        renderer.domElement,
        document.body.firstChild
    );

    scene.add(
        new THREE.HemisphereLight(0xffffff, 0x506040, 2)
    );

    const sunlight = new THREE.DirectionalLight(0xffffff, 2);

    sunlight.position.set(-5, 12, 8);

    scene.add(sunlight);

    createWorld();
    createPlayer();
    setupControls();

    window.addEventListener("resize", resize);

    renderer.setAnimationLoop(animate);
}

function createWorld() {

    // Grass
    addBox(
        scene, 200, 0.2, 300,
        0x398a38, 0, -0.2, -100
    );

    // Road
    addBox(
        scene, 9.5, 0.12, 260,
        0x303238, 0, -0.06, -100
    );

    // Road edges
    addBox(
        scene, 0.18, 0.16, 260,
        0xffffff, -4.65, 0.03, -100
    );

    addBox(
        scene, 0.18, 0.16, 260,
        0xffffff, 4.65, 0.03, -100
    );

    // Dashed lane lines
    for (let z = -225; z < 20; z += 10) {

        for (const x of [-1.55, 1.55]) {

            const line = addBox(
                scene, 0.12, 0.025, 4.5,
                0xffffff, x, 0.02, z
            );

            roadLines.push(line);
        }
    }

    // Trees on both sides
    for (let i = 0; i < 48; i++) {

        const side = i % 2 === 0 ? -1 : 1;
        const z = 12 - Math.floor(i / 2) * 10;

        const tree = new THREE.Group();

        tree.position.set(
            side * (7 + Math.random() * 4),
            0,
            z
        );

        addBox(
            tree, 0.35, 1.5, 0.35,
            0x754421, 0, 0.7, 0
        );

        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.25, 3.3, 7),
            new THREE.MeshStandardMaterial({
                color: 0x12652b
            })
        );

        leaves.position.y = 2.6;

        tree.add(leaves);
        scene.add(tree);

        scenery.push(tree);
    }

    // Distant mountains
    for (let i = 0; i < 12; i++) {

        const mountain = new THREE.Mesh(
            new THREE.ConeGeometry(8, 15, 5),
            new THREE.MeshStandardMaterial({
                color: 0x719b9c
            })
        );

        mountain.position.set(
            (i % 2 === 0 ? -1 : 1) *
            (25 + Math.random() * 20),

            6,

            -60 - Math.random() * 80
        );

        scene.add(mountain);
    }
}

function createCar(color) {

    const car = new THREE.Group();

    const paint = new THREE.MeshStandardMaterial({
        color: color,
        metalness: 0.4,
        roughness: 0.3
    });

    // Main body
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.55, 0.48, 2.8),
        paint
    );

    body.position.y = 0.55;
    car.add(body);

    // Hood
    const hood = new THREE.Mesh(
        new THREE.BoxGeometry(1.35, 0.2, 0.85),
        paint
    );

    hood.position.set(0, 0.77, -0.78);
    car.add(hood);

    // Cabin
    const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.12, 0.52, 1.15),
        new THREE.MeshStandardMaterial({
            color: 0x182b3a,
            metalness: 0.25,
            roughness: 0.2
        })
    );

    cabin.position.set(0, 0.99, 0.12);
    car.add(cabin);

    // Lights and wheels
    for (const x of [-0.48, 0.48]) {

        addBox(
            car, 0.28, 0.13, 0.08,
            0xfff5b0, x, 0.64, -1.42
        );

        addBox(
            car, 0.25, 0.12, 0.08,
            0xff1515, x, 0.58, 1.42
        );
    }

    for (const x of [-0.83, 0.83]) {

        for (const z of [-0.85, 0.9]) {

            const wheel = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.29, 0.29, 0.18, 12
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x151515
                })
            );

            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(x, 0.32, z);

            car.add(wheel);
        }
    }

    return car;
}

function createPlayer() {

    player = createCar(0x078bff);

    player.position.set(0, 0, 5);

    scene.add(player);
}

function spawnTraffic() {

    // Cars ahead are checked to maintain safe gaps.
    const spawnZ = -120;
    const minimumGap = 42;

    const availableLanes = lanes.filter(lane => {

        return !traffic.some(car => {

            const sameLane =
                Math.abs(car.position.x - lane) < 0.6;

            const tooClose =
                Math.abs(car.position.z - spawnZ) < minimumGap;

            return sameLane && tooClose;
        });

    });

    // Wait if every lane has a nearby car.
    if (availableLanes.length === 0) {
        return;
    }

    // Prefer a lane with the fewest cars ahead.
    availableLanes.sort((a, b) => {

        const countA = traffic.filter(car =>
            Math.abs(car.position.x - a) < 0.6
        ).length;

        const countB = traffic.filter(car =>
            Math.abs(car.position.x - b) < 0.6
        ).length;

        return countA - countB;
    });

    const lane = availableLanes[
        Math.floor(Math.random() * Math.min(2, availableLanes.length))
    ];

    const color = carColors[
        Math.floor(Math.random() * carColors.length)
    ];

    const car = createCar(color);

    car.position.set(lane, 0, spawnZ);

    car.userData.passed = false;

    // Traffic speed is slower than the player's car.
    car.userData.speed = 0.55 + Math.random() * 0.15;

    scene.add(car);
    traffic.push(car);
}

function removeTraffic(car) {

    scene.remove(car);

    car.traverse(obj => {

        if (obj.geometry) {
            obj.geometry.dispose();
        }

        if (obj.material) {

            if (Array.isArray(obj.material)) {
                obj.material.forEach(m => m.dispose());
            } else {
                obj.material.dispose();
            }
        }
    });
}

function resetGame() {

    for (const car of traffic) {
        removeTraffic(car);
    }

    traffic = [];

    speed = 0;
    distance = 0;
    score = 0;
    spawnTimer = 0;

    player.position.x = 0;
    player.rotation.z = 0;

    keys.left = false;
    keys.right = false;
    keys.brake = false;
    keys.nitro = false;

    running = true;

    lastTime = performance.now();

    $("overlay").classList.add("hidden");

    updateHUD();
}

function gameOver() {

    running = false;

    highScore = Math.max(highScore, score);

    try {
        localStorage.setItem(
            "racerHighScore",
            String(highScore)
        );
    } catch(e) {}

    $("title").textContent = "💥 GAME OVER";

    $("message").innerHTML =
        "Score: <b>" + score + "</b><br>" +
        "Distance: <b>" + Math.floor(distance) + " m</b><br>" +
        "Best Score: <b>" + highScore + "</b>";

    $("start").textContent = "RACE AGAIN 🔄";

    $("overlay").classList.remove("hidden");
}

function updateHUD() {

    $("score").textContent = score;

    $("distance").textContent = Math.floor(distance);

    $("speed").textContent = Math.floor(speed);
}

function setupControls() {

    function bind(id, key) {

        const button = $(id);

        const down = e => {
            e.preventDefault();
            keys[key] = true;

            try {
                button.setPointerCapture(e.pointerId);
            } catch(err) {}
        };

        const up = e => {
            e.preventDefault();
            keys[key] = false;
        };

        button.addEventListener("pointerdown", down);
        button.addEventListener("pointerup", up);
        button.addEventListener("pointercancel", up);
        button.addEventListener("lostpointercapture", up);
    }

    bind("left", "left");
    bind("right", "right");
    bind("brake", "brake");
    bind("nitro", "nitro");

    window.addEventListener("keydown", e => {

        if ([
            "ArrowLeft", "ArrowRight",
            "ArrowUp", "ArrowDown", " "
        ].includes(e.key)) {
            e.preventDefault();
        }

        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
            keys.left = true;
        }

        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
            keys.right = true;
        }

        if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
            keys.brake = true;
        }

        if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
            speed = Math.max(speed, 80);
        }

        if (e.code === "Space") {
            keys.nitro = true;
        }
    });

    window.addEventListener("keyup", e => {

        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
            keys.left = false;
        }

        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
            keys.right = false;
        }

        if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
            keys.brake = false;
        }

        if (e.code === "Space") {
            keys.nitro = false;
        }
    });

    $("start").addEventListener("click", resetGame);
}

function resize() {

    camera.aspect = innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
}

function animate(time) {

    const dt = Math.min(
        (time - (lastTime || time)) / 1000,
        0.05
    );

    lastTime = time;

    if (running) {
        update(dt);
    }

    renderer.render(scene, camera);
}

function update(dt) {

    const maxSpeed = keys.nitro ? 220 : 160;
    const acceleration = keys.nitro ? 90 : 55;

    if (keys.brake) {

        speed = Math.max(0, speed - 110 * dt);

    } else {

        speed = Math.min(
            maxSpeed,
            speed + acceleration * dt
        );
    }

    const worldSpeed = speed / 12;

    // Steering
    if (keys.left) {
        player.position.x -= 5.4 * dt;
    }

    if (keys.right) {
        player.position.x += 5.4 * dt;
    }

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -3.75,
        3.75
    );

    const tilt = keys.left ? 0.13 :
                 keys.right ? -0.13 : 0;

    player.rotation.z = THREE.MathUtils.lerp(
        player.rotation.z,
        tilt,
        dt * 7
    );

    // Moving road markings
    for (const line of roadLines) {

        line.position.z += worldSpeed * dt;

        if (line.position.z > 15) {
            line.position.z -= 240;
        }
    }

    // Moving roadside trees
    for (const tree of scenery) {

        tree.position.z += worldSpeed * dt * 0.8;

        if (tree.position.z > 18) {
            tree.position.z -= 240;
        }
    }

    // Traffic spawns less frequently.
    spawnTimer += dt;

    const spawnDelay = Math.max(
        2.4,
        3.5 - speed / 180
    );

    if (spawnTimer >= spawnDelay) {

        spawnTraffic();

        spawnTimer = 0;
    }

    // Move cars and check collisions
    for (let i = traffic.length - 1; i >= 0; i--) {

        const car = traffic[i];

        car.position.z +=
            worldSpeed * dt * car.userData.speed;

        const closeX =
            Math.abs(car.position.x - player.position.x) < 1.35;

        const closeZ =
            Math.abs(car.position.z - player.position.z) < 2.05;

        if (closeX && closeZ) {

            gameOver();

            return;
        }

        if (car.position.z > 18) {

            if (!car.userData.passed) {

                score += 10;

                car.userData.passed = true;
            }

            removeTraffic(car);

            traffic.splice(i, 1);
        }
    }

    distance += speed * dt / 3.6;

    score += Math.floor(speed * dt / 10);

    // Smooth follow camera
    camera.position.x = THREE.MathUtils.lerp(
        camera.position.x,
        player.position.x * 0.35,
        dt * 3
    );

    camera.lookAt(
        player.position.x * 0.25,
        0,
        -12
    );

    updateHUD();
}

if (typeof THREE === "undefined") {

    $("title").textContent = "Internet Required";

    $("message").textContent =
        "Three.js could not load. Please connect to the internet and reload the game.";

} else {

    init();
}

})();
</script>

</body>
</html>
